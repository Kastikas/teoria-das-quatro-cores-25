name: CI & Formal Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  algebraic-and-discharging:
    name: Algebraic & Discharging Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install scipy

      - name: Run Rust unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Compile C Discharging Verifiers
        run: make verifiers

      - name: Verify 21-Configuration World Record (Folder 10)
        run: ./scripts/verify.sh 21

      - name: Verify 10-Configuration Inverse Discharging Model (Folder 11)
        run: ./scripts/verify.sh 10
